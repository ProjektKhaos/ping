<VirtualHost *:80>
    ServerName ping.aberg.online
    DocumentRoot /var/www/abergonline/ping

    <Directory /var/www/abergonline/ping>
        Options -Indexes -ExecCGI
        AllowOverride None
        Require all granted
        DirectoryIndex index.php
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/ping.aberg.online-error.log
    CustomLog ${APACHE_LOG_DIR}/ping.aberg.online-access.log combined
</VirtualHost>
